
services:
  db:
    image: postgres:15
    container_name: alertx_db
    restart: always
    environment:
      POSTGRES_DB: sos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: alertx_app
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      DB_NAME: sos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data:
